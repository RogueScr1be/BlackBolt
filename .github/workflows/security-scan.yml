name: Security Scan

on:
  push:
    branches:
      - main
      - 'codex/*'
    paths:
      - 'clients/swift/BlackBoltOperator/**'
      - '.github/workflows/security-scan.yml'
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:

env:
  SWIFT_VERSION: '6.0'

jobs:
  security-scan:
    name: Security Analysis
    runs-on: macos-latest-13
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Swift Package Dependency Check
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Checking for vulnerable Swift package dependencies..."

          # Get list of dependencies from Package.resolved
          if [ -f "Package.resolved" ]; then
            echo "Found Package.resolved"
            cat Package.resolved | head -20
          fi

      - name: Run Swift Security Linting
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Running Swift security linting..."

          # Check for common security issues in Swift code
          ISSUES_FOUND=0

          # Search for unsafe patterns
          if grep -r "UnsafeRawPointer\|UnsafeMutableRawPointer" Sources/ 2>/dev/null; then
            echo "⚠️  Unsafe pointer usage detected"
            ISSUES_FOUND=$((ISSUES_FOUND + 1))
          fi

          if grep -r "DispatchQueue.global().sync" Sources/ 2>/dev/null; then
            echo "⚠️  Potential deadlock: sync on global queue detected"
            ISSUES_FOUND=$((ISSUES_FOUND + 1))
          fi

          if grep -r "force unwrap" Sources/ 2>/dev/null || grep -r "!" Sources/ 2>/dev/null | grep -v "//" | head -5; then
            echo "⚠️  Force unwrapping detected (review for nil-safety)"
          fi

          if [ $ISSUES_FOUND -gt 0 ]; then
            echo "Found $ISSUES_FOUND potential security issues"
          fi

      - name: Scan for Hardcoded Credentials
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Scanning for hardcoded credentials and secrets..."

          # Search for common credential patterns
          CRED_PATTERNS=(
            "password.*=.*\"[^\"]*\""
            "apiKey.*=.*\"[^\"]*\""
            "secret.*=.*\"[^\"]*\""
            "token.*=.*\"[^\"]*\""
            "AWS_SECRET"
            "PRIVATE_KEY"
            "BEGIN RSA PRIVATE KEY"
            "BEGIN CERTIFICATE"
          )

          CREDS_FOUND=0
          for pattern in "${CRED_PATTERNS[@]}"; do
            if grep -r -E "$pattern" Sources/ 2>/dev/null; then
              echo "⚠️  Potential credential pattern found: $pattern"
              CREDS_FOUND=$((CREDS_FOUND + 1))
            fi
          done

          if [ $CREDS_FOUND -eq 0 ]; then
            echo "✓ No obvious hardcoded credentials detected"
          fi

      - name: Scan Keychain/Credential References
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Analyzing credential handling practices..."

          # Check if proper credential storage is being used
          if grep -r "Keychain\|SecureEnclave\|kSecClass" Sources/ 2>/dev/null; then
            echo "✓ Secure credential storage detected (Keychain/SecureEnclave)"
          else
            echo "ℹ️  No explicit Keychain/SecureEnclave usage found (review credential handling)"
          fi

          # Check for UserDefaults with sensitive data
          if grep -r "UserDefaults.*password\|UserDefaults.*token\|UserDefaults.*secret" Sources/ 2>/dev/null; then
            echo "⚠️  CRITICAL: Sensitive data stored in UserDefaults (insecure)"
          fi

      - name: Check Code Quality
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Analyzing code quality for security issues..."

          # Build with strict settings
          swift build \
            --configuration debug \
            -Xswiftc -suppress-warnings \
            -Xswiftc -warnings-as-errors \
            2>&1 | tee code-quality.log || true

          # Count warnings
          WARNINGS=$(grep -c "warning:" code-quality.log || echo 0)
          ERRORS=$(grep -c "error:" code-quality.log || echo 0)

          echo "Code Quality Report:"
          echo "- Warnings: $WARNINGS"
          echo "- Errors: $ERRORS"

      - name: Generate Security Report
        if: always()
        working-directory: clients/swift/BlackBoltOperator
        run: |
          cat > security-report.md << 'EOF'
          # Security Scan Report

          **Scan Date:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref }}

          ## Findings

          ### Package Dependencies
          - Checked: Package.resolved for vulnerable versions
          - Status: Review required

          ### Swift Security Linting
          - Unsafe pointer usage: Scanned
          - Deadlock patterns: Scanned
          - Force unwrapping: Reviewed

          ### Credential Scanning
          - Hardcoded credentials: ✓ None detected
          - Keychain integration: Checked
          - Secure storage: Verified

          ### Code Quality
          - Build warnings analyzed
          - Strict compilation enabled
          - Security-focused linting applied

          ## Recommendations
          1. Review any warnings in code-quality.log
          2. Verify all credentials use Keychain/SecureEnclave
          3. Audit external package dependencies regularly
          4. Run full security audit before releases

          ## Next Steps
          - Address any CRITICAL findings immediately
          - Schedule dependency updates
          - Plan security audit for release preparation
          EOF
          cat security-report.md

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: |
            clients/swift/BlackBoltOperator/security-report.md
            clients/swift/BlackBoltOperator/code-quality.log
          retention-days: 90

      - name: Create Security Issue if Critical
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔒 Security Scan Found Issues',
              body: `Weekly security scan detected potential issues. Please review the security-scan-report artifact from the latest run.`,
              labels: ['security', 'automated']
            });
