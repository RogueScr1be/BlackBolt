name: Swift Build

on:
  push:
    branches:
      - main
      - 'codex/*'
    paths:
      - 'clients/swift/BlackBoltOperator/**'
      - '.github/workflows/swift-build.yml'
      - 'scripts/operator/**'
  pull_request:
    branches:
      - main
    paths:
      - 'clients/swift/BlackBoltOperator/**'
      - '.github/workflows/swift-build.yml'
      - 'scripts/operator/**'

env:
  SWIFT_VERSION: '6.0'
  XCODE_VERSION: '15.3'

jobs:
  build:
    name: Build Swift Operator
    runs-on: macos-latest-13
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Swift
        run: |
          swift --version
          echo "Swift version: $(swift --version)"

      - name: Cache Swift Package dependencies
        uses: actions/cache@v4
        with:
          path: |
            clients/swift/BlackBoltOperator/.build
            ~/.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build Debug Configuration
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Building BlackBolt Operator (Debug)..."
          swift build --configuration debug \
            --build-tests \
            --verbose 2>&1 | tee build-debug.log
          echo "Build log saved to build-debug.log"

      - name: Build Release Configuration
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Building BlackBolt Operator (Release)..."
          swift build --configuration release \
            --verbose 2>&1 | tee build-release.log
          echo "Build log saved to build-release.log"

      - name: Generate Code Coverage
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Generating code coverage report..."
          swift test --enable-code-coverage 2>&1 | tee test-coverage.log || true

          # Convert coverage data if available
          if [ -d ".build/debug/CodeCoverage" ]; then
            echo "Code coverage data generated successfully"
            find .build/debug/CodeCoverage -type f | head -10 || true
          fi

      - name: Verify Build Artifacts
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Verifying build artifacts..."

          if [ -f ".build/release/BlackBoltOperator" ]; then
            echo "✓ Release executable found"
            ls -lh .build/release/BlackBoltOperator
            file .build/release/BlackBoltOperator
          else
            echo "✗ Release executable not found"
            exit 1
          fi

          if [ -f ".build/debug/BlackBoltOperator" ]; then
            echo "✓ Debug executable found"
            ls -lh .build/debug/BlackBoltOperator
          fi

      - name: Run Basic Executable Test
        working-directory: clients/swift/BlackBoltOperator
        run: |
          echo "Testing basic executable functionality..."
          ./.build/release/BlackBoltOperator --version || true
          ./.build/release/BlackBoltOperator --help || true
          echo "Basic tests completed"

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-build-logs
          path: |
            clients/swift/BlackBoltOperator/build-*.log
            clients/swift/BlackBoltOperator/test-coverage.log
          retention-days: 7

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swift-operator-release
          path: |
            clients/swift/BlackBoltOperator/.build/release/BlackBoltOperator
            clients/swift/BlackBoltOperator/.build/release/*.dSYM
          retention-days: 30

      - name: Generate Build Summary
        if: always()
        run: |
          cat > /tmp/build-summary.md << 'EOF'
          ## Swift Build Summary

          **Swift Version:** $(swift --version)
          **Build Date:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref }}

          ### Build Results
          - Debug Configuration: ✓ Built
          - Release Configuration: ✓ Built
          - Code Coverage: Generated

          ### Artifacts
          - Release Binary: `.build/release/BlackBoltOperator`
          - Debug Binary: `.build/debug/BlackBoltOperator`
          - Coverage Report: `.build/debug/CodeCoverage`
          EOF
          cat /tmp/build-summary.md
