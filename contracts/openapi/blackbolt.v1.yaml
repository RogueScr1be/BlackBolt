openapi: 3.1.0
info:
  title: Black Bolt API
  version: 1.0.0
  description: Contract-first API surface for Black Bolt Tier-1.
servers:
  - url: https://api.blackbolt.example
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Health check endpoint
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/bootstrap/status:
    get:
      operationId: getBootstrapStatus
      tags: [operator, bootstrap]
      summary: Get tenant bootstrap readiness status
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
      responses:
        '200':
          description: Bootstrap readiness response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatusResponse'

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [operator]
      summary: Operator dashboard summary
      description: Returns top-level KPI summary and dashboard widget counts for the scoped tenant.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'

  /events:
    get:
      operationId: listOperatorEvents
      tags: [operator]
      summary: List operator activity events
      description: Returns tenant-scoped event feed items ordered newest-first.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorEventsResponse'

  /alerts:
    get:
      operationId: listOperatorAlerts
      tags: [operator]
      summary: List operator alerts
      description: Returns tenant-scoped alerts; default state is open.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, all]
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAlertsResponse'

  /tenants:
    get:
      operationId: listOperatorTenants
      tags: [operator]
      summary: List operator-visible tenants
      description: Returns tenant list for the current operator scope.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorTenantListResponse'

  /tenants/{tenantId}:
    get:
      operationId: getOperatorTenant
      tags: [operator]
      summary: Get operator tenant detail
      description: Returns detail for a tenant scoped by tenant header and path.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorTenantDetail'

  /tenants/{tenantId}/metrics:
    get:
      operationId: getOperatorTenantMetrics
      tags: [operator]
      summary: Get operator tenant metrics time series
      description: Returns tenant metrics series for dashboard ranges.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [30d, 90d, ytd]
      responses:
        '200':
          description: Tenant metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorTenantMetricsResponse'

  /v1/operator/portfolio/tenants:
    get:
      operationId: listOperatorPortfolioTenants
      tags: [operator]
      summary: List operator portfolio tenants
      description: Returns all tenant memberships available to the authenticated portfolio operator key.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
      responses:
        '200':
          description: Portfolio tenant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorTenantListResponse'

  /v1/operator/reviews/queue:
    get:
      operationId: listOperatorReviewQueue
      tags: [operator, reviews]
      summary: List review queue across operator portfolio
      description: Returns review queue items filtered by state, tenant, and timestamp.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [new, classified, awaiting_approval, scheduled, sent, all]
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Review queue list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorReviewQueueResponse'

  /v1/operator/review-actions:
    get:
      operationId: listOperatorReviewActions
      tags: [operator, reviews]
      summary: List review operator actions across operator portfolio
      description: Returns public-review operator actions filtered by status and tenant.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, reviewed, dismissed, all]
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Review operator action list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorReviewActionListResponse'

  /v1/operator/review-actions/public-reply-suggestion:
    post:
      operationId: createOperatorReviewAction
      tags: [operator, reviews]
      summary: Create a public reply suggestion for a review
      description: Creates or returns a customerless operator suggestion for a public GBP review.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorReviewActionCreateRequest'
      responses:
        '200':
          description: Public reply suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorReviewActionSummary'

  /v1/operator/review-actions/{actionId}:
    patch:
      operationId: updateOperatorReviewAction
      tags: [operator, reviews]
      summary: Update a review operator action status
      description: Marks a public-review operator action reviewed or dismissed.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: actionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorReviewActionUpdateRequest'
      responses:
        '200':
          description: Updated review operator action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorReviewActionSummary'

  /v1/operator/approvals:
    get:
      operationId: listOperatorApprovals
      tags: [operator, approvals]
      summary: List approval items across operator portfolio
      description: Returns approval cards for awaiting_approval, approved, or rejected state.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [awaiting_approval, approved, rejected, all]
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Approval list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorApprovalListResponse'

  /v1/operator/approvals/{approvalId}:
    get:
      operationId: getOperatorApproval
      tags: [operator, approvals]
      summary: Get approval item detail
      description: Returns full draft/edit context and run counts for one approval item.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approval detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorApprovalDetail'

  /v1/operator/approvals/{approvalId}/draft:
    patch:
      operationId: patchOperatorApprovalDraft
      tags: [operator, approvals]
      summary: Patch draft fields for an approval item
      description: Applies operator edits to subject, body, segment, and send window before approval.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorApprovalDraftPatchRequest'
      responses:
        '200':
          description: Updated approval detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorApprovalDetail'

  /v1/operator/approvals/{approvalId}/approve:
    post:
      operationId: approveOperatorApproval
      tags: [operator, approvals]
      summary: Approve a reactivation run
      description: Atomically approves a run and transitions paused messages into queued state.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approval success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorApprovalMutationResponse'

  /v1/operator/approvals/{approvalId}/reject:
    post:
      operationId: rejectOperatorApproval
      tags: [operator, approvals]
      summary: Reject a reactivation run
      description: Rejects an approval item and keeps the run paused/closed with audit metadata.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejection success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorApprovalMutationResponse'

  /v1/operator/reviews/{reviewId}/reactivation-runs:
    post:
      operationId: retriggerReviewReactivationRun
      tags: [operator, reviews]
      summary: Manual reactivation run retrigger
      description: Request a manual retrigger for review-driven reactivation workflow.
      parameters:
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
      responses:
        '200':
          description: Retrigger response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorRetriggerResponse'

  /v1/auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Placeholder login endpoint
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedError'

  /v1/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: Placeholder tenant listing endpoint
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedError'

  /v1/tenants/{tenantId}/customers/imports:
    post:
      operationId: createCustomerImport
      tags: [customers, imports]
      summary: Upload customer CSV import
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Import accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImportResponse'

  /v1/imports/{importId}:
    get:
      operationId: getCustomerImportStatus
      tags: [imports]
      summary: Get customer import status
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/ImportIdPath'
      responses:
        '200':
          description: Import status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStatusResponse'

  /v1/tenants/{tenantId}/customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List tenant customers with optional segment filter
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: segment
          in: query
          schema: { $ref: '#/components/schemas/CustomerSegment' }
      responses:
        '200':
          description: Customer page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCustomersResponse'

  /v1/tenants/{tenantId}/segments:
    get:
      operationId: listCustomerSegments
      tags: [customers]
      summary: List tenant customer segment counts
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: Customer segment summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSegmentsResponse'

  /v1/tenants/{tenantId}/suppressions/imports:
    post:
      operationId: createSuppressionImport
      tags: [suppressions, imports]
      summary: Upload suppression CSV import
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Suppression import accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSuppressionImportResponse'

  /v1/suppressions/imports/{suppressionImportId}:
    get:
      operationId: getSuppressionImportStatus
      tags: [suppressions, imports]
      summary: Get suppression import status
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/SuppressionImportIdPath'
      responses:
        '200':
          description: Suppression import status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppressionImportStatusResponse'

  /v1/tenants/{tenantId}/integrations/gbp:
    patch:
      operationId: setGbpIntegration
      tags: [integrations, gbp]
      summary: Set GBP tenant integration references
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGbpIntegrationRequest'
      responses:
        '200':
          description: Integration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GbpIntegrationResponse'

  /v1/tenants/{tenantId}/integrations/gbp/operator-summary:
    get:
      operationId: getGbpOperatorSummary
      tags: [integrations, gbp, operator]
      summary: Get GBP integration and ingest operator summary
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: GBP operator summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GbpOperatorSummaryResponse'

  /v1/tenants/{tenantId}/reviews/poll:
    post:
      operationId: pollGbpReviews
      tags: [reviews, gbp]
      summary: Enqueue GBP review polling job
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '202':
          description: Poll accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollReviewsResponse'

  /v1/tenants/{tenantId}/reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List GBP reviews for tenant
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Review page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReviewsResponse'

  /v1/tenants/{tenantId}/revenue/events:
    post:
      operationId: createRevenueEvent
      summary: Create a revenue event (manual ingest for proof layer)
      description: |
        Creates an idempotent revenue event for attribution. No payment processing.
        Requires an Idempotency-Key header (or request field, per contract) and is tenant-scoped.
      tags: [Revenue]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevenueEventCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueEventCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/tenants/{tenantId}/revenue/imports:
    post:
      operationId: createRevenueImport
      tags: [revenue, imports]
      summary: Upload revenue CSV import
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Revenue import accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRevenueImportResponse'
    get:
      operationId: listRevenueImports
      tags: [revenue, imports]
      summary: List recent revenue imports for tenant
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Revenue import list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueImportListResponse'

  /v1/revenue-imports/{revenueImportId}:
    get:
      operationId: getRevenueImportStatus
      tags: [revenue, imports]
      summary: Get revenue import status
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - name: revenueImportId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revenue import status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueImportStatusResponse'

  /v1/tenants/{tenantId}/revenue/summary:
    get:
      operationId: getRevenueSummary
      summary: Revenue proof summary (attribution rollup)
      description: |
        Returns an attribution rollup using a conservative model (initially LAST_TOUCH).
        Windows: Direct (7d) and Assisted (30d).
      tags: [Revenue]
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - name: from
          in: query
          required: false
          description: ISO8601 datetime (inclusive). Defaults to now-30d.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: ISO8601 datetime (exclusive). Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/tenants/{tenantId}/campaign-runs:
    get:
      operationId: listCampaignRuns
      tags: [campaigns, operator]
      summary: List campaign runs for tenant
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Campaign run list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CampaignRunSummary' }

  /v1/tenants/{tenantId}/campaign-runs/{runId}:
    get:
      operationId: getCampaignRun
      tags: [campaigns, operator]
      summary: Get campaign run detail
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RunIdPath'
      responses:
        '200':
          description: Campaign run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignRunDetail'

  /v1/tenants/{tenantId}/campaign-runs/{runId}/pause:
    post:
      operationId: pauseCampaignRun
      tags: [campaigns, operator]
      summary: Pause a campaign run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RunIdPath'
      responses:
        '200':
          description: Campaign run paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorInterventionResponse'

  /v1/tenants/{tenantId}/campaign-runs/{runId}/resume:
    post:
      operationId: resumeCampaignRun
      tags: [campaigns, operator]
      summary: Resume a paused campaign run
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/RunIdPath'
      responses:
        '200':
          description: Campaign run resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorInterventionResponse'

  /v1/links/{code}:
