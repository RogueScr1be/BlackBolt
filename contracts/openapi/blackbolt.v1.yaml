        - $ref: '#/components/parameters/OperatorKeyHeader'
        - $ref: '#/components/parameters/TenantIdPath'
      responses:
        '200':
          description: Rotated key response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateOperatorKeyResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: x-tenant-id
      in: header
      required: true
      schema: { type: string }
    OperatorKeyHeader:
      name: X-Operator-Key
      in: header
      required: true
      schema: { type: string }
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
    RunIdPath:
      name: runId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: |
        Required idempotency key for create operations. Must be stable across retries.
    ImportIdPath:
      name: importId
      in: path
      required: true
      schema: { type: string }
    SuppressionImportIdPath:
      name: suppressionImportId
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [ok, service, version]
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        checks:
          type: object
          nullable: true
          properties:
            db: { type: boolean }
            redis: { type: boolean }
            worker_heartbeat: { type: boolean }
            last_worker_activity_at: { type: string, format: date-time, nullable: true }
    BootstrapStatusCheck:
      type: object
      required: [required, ready, message]
      properties:
        required: { type: boolean }
        ready: { type: boolean }
        mode:
          type: string
          nullable: true
          enum: [shadow, live]
        message: { type: string }
    BootstrapStatusChecks:
      type: object
      required: [operator_auth, gbp_integration, postmark_webhook, review_scheduler, send_mode]
      properties:
        operator_auth: { $ref: '#/components/schemas/BootstrapStatusCheck' }
        gbp_integration: { $ref: '#/components/schemas/BootstrapStatusCheck' }
        postmark_webhook: { $ref: '#/components/schemas/BootstrapStatusCheck' }
        review_scheduler: { $ref: '#/components/schemas/BootstrapStatusCheck' }
        send_mode: { $ref: '#/components/schemas/BootstrapStatusCheck' }
    BootstrapStatusResponse:
      type: object
      required: [tenant_id, overall_ready, checks, missing]
      properties:
        tenant_id: { type: string }
        overall_ready: { type: boolean }
        checks: { $ref: '#/components/schemas/BootstrapStatusChecks' }
        missing:
          type: array
          items: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    NotImplementedError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            statusCode: { type: integer, enum: [501] }
    CreateImportResponse:
      type: object
      required: [importId, status]
      properties:
        importId: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
    CreateSuppressionImportResponse:
      type: object
      required: [suppressionImportId, status]
      properties:
        suppressionImportId: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
    ImportStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    ImportError:
      type: object
      required: [code, message]
      properties:
        rowNum: { type: integer, nullable: true }
        code: { type: string }
        message: { type: string }
    ImportStatusResponse:
      type: object
      required: [importId, tenantId, status, totalRows, processedRows, succeededRows, failedRows, duplicateRows]
      properties:
        importId: { type: string }
        tenantId: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        totalRows: { type: integer }
        processedRows: { type: integer }
        succeededRows: { type: integer }
        failedRows: { type: integer }
        duplicateRows: { type: integer }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ImportError' }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    SuppressionImportStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ImportStatusResponse'
        - type: object
          required: [suppressionImportId]
          properties:
            suppressionImportId: { type: string }
    RevenueImportStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    RevenueImportError:
      type: object
      required: [code, message]
      properties:
        rowNum: { type: integer, nullable: true }
        code: { type: string }
        message: { type: string }
    CreateRevenueImportResponse:
      type: object
      required: [revenueImportId, status]
      properties:
        revenueImportId: { type: string }
        status: { $ref: '#/components/schemas/RevenueImportStatus' }
    RevenueImportListItem:
      type: object
      required: [revenueImportId, tenantId, status, totalRows, processedRows, succeededRows, failedRows, duplicateRows, createdAt]
      properties:
        revenueImportId: { type: string }
        tenantId: { type: string }
        status: { $ref: '#/components/schemas/RevenueImportStatus' }
        totalRows: { type: integer }
        processedRows: { type: integer }
        succeededRows: { type: integer }
        failedRows: { type: integer }
        duplicateRows: { type: integer }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    RevenueImportListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RevenueImportListItem' }
    RevenueImportStatusResponse:
      type: object
      required: [revenueImportId, tenantId, status, totalRows, processedRows, succeededRows, failedRows, duplicateRows]
      properties:
        revenueImportId: { type: string }
        importId: { type: string }
        tenantId: { type: string }
        status: { $ref: '#/components/schemas/RevenueImportStatus' }
        totalRows: { type: integer }
        processedRows: { type: integer }
        succeededRows: { type: integer }
        failedRows: { type: integer }
        duplicateRows: { type: integer }
        errors:
          type: array
          items: { $ref: '#/components/schemas/RevenueImportError' }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    CustomerSegment:
      type: string
      enum: [0_90, 90_365, 365_plus]
    Customer:
      type: object
      required: [id, tenantId, email, segment, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        externalCustomerRef: { type: string, nullable: true }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        lastServiceDate: { type: string, format: date-time, nullable: true }
        segment: { $ref: '#/components/schemas/CustomerSegment' }
        createdAt: { type: string, format: date-time }
    ListCustomersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        nextCursor: { type: string, nullable: true }
    CustomerSegmentCount:
      type: object
      required: [segment, count]
      properties:
        segment: { $ref: '#/components/schemas/CustomerSegment' }
        count: { type: integer }
    CustomerSegmentsResponse:
      type: object
      required: [tenantId, total, items]
      properties:
        tenantId: { type: string }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerSegmentCount' }
    SetGbpIntegrationRequest:
      type: object
      required: [gbpAccountId, gbpLocationId, gbpAccessTokenRef]
      properties:
        gbpAccountId: { type: string }
        gbpLocationId: { type: string }
        gbpAccessTokenRef: { type: string }
        reason: { type: string, nullable: true }
    GbpIntegrationResponse:
      type: object
      required: [tenantId, gbpAccountId, gbpLocationId, gbpAccessTokenRef, gbpIntegrationStatus]
      properties:
        tenantId: { type: string }
        gbpAccountId: { type: string }
        gbpLocationId: { type: string }
        gbpAccessTokenRef: { type: string }
        gbpIntegrationStatus: { type: string, enum: [CONNECTED, NEEDS_REAUTH, DISCONNECTED] }
    PollReviewsResponse:
      type: object
      required: [queue]
      properties:
        jobId: { type: string, nullable: true }
        queue: { type: string }
        cooldownUntil: { type: string, format: date-time, nullable: true }
    Review:
      type: object
      required: [id, tenantId, source, sourceReviewId, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        source: { type: string, enum: [GBP] }
        sourceReviewId: { type: string }
        rating: { type: integer, nullable: true }
        body: { type: string, nullable: true }
        reviewerName: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ListReviewsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        nextCursor: { type: string, nullable: true }
    JobRunTelemetry:
      type: object
      properties:
        pages_fetched: { type: integer }
        reviews_fetched: { type: integer }
        upserted: { type: integer }
        skipped: { type: integer }
        cooldown_applied: { type: boolean }
        error_class: { type: string, nullable: true }
    LatestJobRunSummary:
      type: object
      required: [id, state, createdAt]
      properties:
        id: { type: string }
        state: { type: string, enum: [queued, running, retrying, succeeded, failed, dead_lettered] }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        metadataJson:
          allOf:
            - $ref: '#/components/schemas/JobRunTelemetry'
          nullable: true
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    IntegrationAlert:
      type: object
      required: [id, code, severity, message, createdAt]
      properties:
        id: { type: string }
        code: { type: string }
        severity: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    GbpOperatorSummaryResponse:
      type: object
      required: [tenantId, gbpIntegrationStatus, alerts]
      properties:
        tenantId: { type: string }
        gbpIntegrationStatus: { type: string, enum: [CONNECTED, NEEDS_REAUTH, DISCONNECTED] }
        cooldownUntil: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        latestJobRun:
          allOf:
            - $ref: '#/components/schemas/LatestJobRunSummary'
          nullable: true
        alerts:
          type: array
          items: { $ref: '#/components/schemas/IntegrationAlert' }
    PostmarkWebhookPayload:
      type: object
      required: [RecordType]
      properties:
        RecordType: { type: string }
        MessageID: { type: string, nullable: true }
        ID: { type: [string, integer], nullable: true }
        ReceivedAt: { type: string, format: date-time, nullable: true }
        DeliveredAt: { type: string, format: date-time, nullable: true }
        BouncedAt: { type: string, format: date-time, nullable: true }
        Metadata:
          type: object
          additionalProperties: true
          nullable: true
      additionalProperties: true
    PostmarkWebhookAccepted:
      type: object
      required: [accepted, duplicate, eventId]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        eventId: { type: string }
        resolved: { type: boolean, nullable: true }
    PostmarkGoogleReviewAlertPayload:
      type: object
      properties:
        MessageID: { type: string, nullable: true }
        MessageStream: { type: string, nullable: true }
        From: { type: string, nullable: true }
        FromFull:
          oneOf:
            - type: string
            - type: object
              properties:
                Email: { type: string, nullable: true }
                Name: { type: string, nullable: true }
        To: { type: string, nullable: true }
        ToFull:
          oneOf:
            - type: string
            - type: object
              properties:
                Email: { type: string, nullable: true }
                Name: { type: string, nullable: true }
        Subject: { type: string, nullable: true }
        TextBody: { type: string, nullable: true }
        HtmlBody: { type: string, nullable: true }
        StrippedTextReply: { type: string, nullable: true }
        ReceivedAt: { type: string, format: date-time, nullable: true }
        Headers:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: object
                properties:
                  Name: { type: string, nullable: true }
                  Value: { type: string, nullable: true }
      additionalProperties: true
    ReviewAlertInboundResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
        disabled: { type: boolean, nullable: true }
        duplicate: { type: boolean, nullable: true }
        reviewAlertEmailId: { type: string, nullable: true }
        alertId: { type: string, nullable: true }
        parsedStatus:
          type: string
          nullable: true
          enum: [parsed, needs_review, quarantined]
    PostmarkSendSummaryItem:
      type: object
      required: [campaignMessageId, status, attempt, lastEventAt]
      properties:
        campaignMessageId: { type: string }
        status: { type: string }
        deliveryState: { type: string, nullable: true }
        providerMessageId: { type: string, nullable: true }
        attempt: { type: integer }
        lastEventAt: { type: string, format: date-time }
    PostmarkWebhookSummaryItem:
      type: object
      required: [id, providerEventId, eventType, receivedAt, reconcileStatus]
      properties:
        id: { type: string }
        providerEventId: { type: string }
        providerMessageId: { type: string, nullable: true }
        eventType: { type: string }
        receivedAt: { type: string, format: date-time }
        payloadRedactedJson:
          type: object
          additionalProperties: true
        reconcileStatus: { type: string }
        lastError: { type: string, nullable: true }
    PostmarkRollup:
      type: object
      required: [sent, simulated, failed]
      properties:
        sent: { type: integer }
        simulated: { type: integer }
        failed: { type: integer }
    PostmarkInvariantBreach:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
        code:
          type: string
          nullable: true
          enum:
            - POSTMARK_SEND_SENT_WITHOUT_PROVIDER_ID
            - POSTMARK_SEND_STUCK_SENDING_WITHOUT_PROVIDER_ID
            - POSTMARK_INVARIANT_UNKNOWN
        severity:
          type: string
          nullable: true
          enum: [high, medium, low]
        message: { type: string, nullable: true }
        detectedAt: { type: string, format: date-time, nullable: true }
        runbookRef: { type: string, nullable: true }
        runbookQuery: { type: string, nullable: true }
        staleThresholdMinutes: { type: integer, nullable: true }
        nextActions:
