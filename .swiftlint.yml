# SwiftLint Configuration for BlackBolt Operator
# Enforces strict code quality standards for Swift code

# SwiftLint version: 0.57.0+
# Compatible with Swift 5.9+

# Rules that will cause linting to fail with severity
strict_rules:
  - empty_enum_arguments
  - implicit_return
  - let_var_whitespace
  - operators_should_be_surrounded_by_spaces
  - operator_usage_whitespace
  - trailing_comma
  - trailing_whitespace
  - vertical_whitespace
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - xctfail_message
  - cyclomatic_complexity
  - force_unwrap
  - force_try
  - force_cast
  - implicitly_unwrapped_optional

# Disabled rules
disabled_rules:
  - file_length
  - type_body_length
  - function_body_length
  - line_length
  - identifier_name

# Rule configurations
line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: false

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 15

nested_type_depth:
  warning: 2
  error: 3

# Naming Conventions
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
  allowed_symbols: ["_"]

private_outlet:
  allow_private_set: true

# Force Unwrap Configuration
force_unwrap:
  severity: error

# Implicitly Unwrapped Optional Configuration
implicitly_unwrapped_optional:
  mode: "all"
  severity: warning

# Force Try Configuration
force_try:
  severity: error

# Force Cast Configuration
force_cast:
  severity: error

# Documentation
documentation_required:
  severity: warning

missing_docs:
  severity: warning
  exclude: ["Tests/*"]

# Naming patterns
nesting:
  max_level: 2
  type_level: 2
  function_level: 2
  check_nesting_in_closures: true

closure_spacing:
  severity: warning

comma_spacing:
  severity: warning

colon:
  severity: warning
  apply_to_dictionaries: true

comment_spacing:
  severity: warning

control_statement:
  severity: warning

custom_rules:
  hardcoded_url:
    name: "Hardcoded URL"
    regex: '(https?|ftp)://[^\s"]+'
    message: "URLs should not be hardcoded. Use configuration or environment variables instead."
    severity: error
    excluded:
      - "Tests/*"
      - "Package.swift"

  hardcoded_secret:
    name: "Hardcoded Secret"
    regex: '(apiKey|API_KEY|secret|SECRET|password|PASSWORD|token|TOKEN)\s*[:=]\s*["\'][^"\']*["\']'
    message: "Secrets should never be hardcoded. Use environment variables or Keychain."
    severity: error
    excluded:
      - "Tests/*"
      - "*.mock.swift"

  todo_without_issue:
    name: "TODO Without Issue Reference"
    regex: 'TODO(?!\s*\([A-Z]+-\d+\))'
    message: "TODO comments should include issue reference: // TODO(ISSUE-123)"
    severity: warning
    excluded:
      - "Tests/*"

# Modules to lint
included:
  - Sources
  - Tests

# Paths to exclude
excluded:
  - Carthage
  - Pods
  - .build
  - "**/*.generated.swift"
  - "**/*+Generated.swift"
  - "Vendor"
  - "**/Mock*.swift"
  - "**/*Test*.swift"

# Reporter configuration
reporter: "xcode"

# Cache configuration
cache:
  included_paths: []
  excluded_paths:
    - Carthage
    - Pods
    - .build
